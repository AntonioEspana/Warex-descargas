name: Publicar Warex

# Publica una versión nueva de Warex para escritorio: baja el código del repositorio privado
# AntonioEspana/Warex, construye el instalador de Windows firmado para el actualizador y lo sube con su
# latest.json a una release de este repositorio. Las aplicaciones instaladas lo ven al abrirse y se
# actualizan solas (desktop/src-tauri/src/client_update.rs en Warex). Va aquí y no en Warex porque en un
# repositorio público los minutos de Actions son gratis.
#
# Solo se lanza a mano (Actions → Publicar Warex → Run workflow), con la versión nueva, más alta que la
# anterior. Necesita, en Settings → Secrets and variables → Actions de este repositorio:
#   - secreto WAREX_CODE_TOKEN: un token de GitHub con Contents: Read-only en AntonioEspana/Warex;
#   - secreto TAURI_SIGNING_PRIVATE_KEY: la clave privada cuya pública está en tauri.conf.json de Warex.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión nueva, p. ej. 0.2.0"
        required: true
      notes:
        description: "Qué trae (opcional)"
        required: false
        default: ""
      ref:
        description: "Rama o commit de Warex que se publica"
        required: false
        default: "main"

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Instalador de Windows y latest.json
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: warex/desktop
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Comprobar la versión y los secretos
        working-directory: .
        env:
          CODE_TOKEN: ${{ secrets.WAREX_CODE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::La versión tiene que ser como 1.2.3"; exit 1; }
          [ -n "$CODE_TOKEN" ] || { echo "::error::Falta el secreto WAREX_CODE_TOKEN"; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          if gh release view "escritorio-v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::La versión $VERSION ya está publicada"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: AntonioEspana/Warex
          ref: ${{ inputs.ref }}
          token: ${{ secrets.WAREX_CODE_TOKEN }}
          path: warex
          persist-credentials: false

      - name: Comprobar la clave pública
        run: |
          node -e 'process.exit(require("./src-tauri/tauri.conf.json").plugins.updater.pubkey ? 0 : 1)' \
            || { echo "::error::Falta la clave pública en plugins.updater.pubkey de tauri.conf.json"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version-file: warex/desktop/.nvmrc
          cache: npm
          cache-dependency-path: warex/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: warex/desktop/src-tauri

      - run: npm ci

      # La versión sale de aquí y no de tauri.conf.json, así que no hace falta subirla en el código.
      - name: Construir el instalador firmado
        run: npm run tauri build -- --bundles nsis --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="escritorio-v$VERSION"
          installer="src-tauri/target/release/bundle/nsis/Warex_${VERSION}_x64-setup.exe"
          url="https://github.com/${{ github.repository }}/releases/download/$tag/Warex_${VERSION}_x64-setup.exe"
          node scripts/latest-json.mjs "$VERSION" "$installer" "$url" "$NOTES" > latest.json
          cat latest.json
          gh release create "$tag" "$installer" "$installer.sig" latest.json --repo "${{ github.repository }}" \
            --title "Warex $VERSION para escritorio" --notes "${NOTES:-Warex $VERSION para escritorio.}" --latest
